            --wait

          # Clean up API key file
          rm "$API_KEY_FILE"

          # Staple the notarization ticket to the app
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"

          # Verify stapling
          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv -t install "$APP_PATH"

          echo "✅ App notarized and stapled successfully"

      - name: Create ZIP from .app bundle
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/macos

          # Create ZIP
          zip -ry "../Claude Cozy_0.6.8_x64.zip" "Claude Cozy.app"

          # Note: DMG creation happens automatically by Tauri if configured in tauri.conf.json

          echo "=== Build outputs ==="
          ls -la ../

      - name: Clean up keychain
        if: always() && github.event_name != 'pull_request'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

      - name: Upload Mac Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-cozy-mac-intel
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/*.zip
