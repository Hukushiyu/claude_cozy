<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Cozy</title>
    <style>
      /* Splash screen - shown while app initializes */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      #app-loading .splash-content {
        text-align: center;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      #app-loading .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 1.5rem;
        background: white;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        animation: pulse 2s ease-in-out infinite;
      }

      #app-loading .logo img {
        width: 80px;
        height: 80px;
        object-fit: contain;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      #app-loading .title {
        font-size: 2rem;
        font-weight: 600;
        color: white;
        margin-bottom: 0.5rem;
        letter-spacing: -0.5px;
      }

      #app-loading .subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 2rem;
      }

      #app-loading .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #app-loading .status {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="splash-content">
        <div class="logo">
          <img src="/icon.png" alt="Claude Cozy" />
        </div>
        <div class="title">Claude Cozy</div>
        <div class="subtitle">Your cozy AI workspace</div>
        <div class="spinner"></div>
        <div class="status" id="loading-status">Initializing...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
