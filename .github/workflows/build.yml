name: Build Claude Terminal

on:
  # Trigger on push to master branch
  push:
    branches: [ master, main ]

  # Trigger on pull requests
  pull_request:
    branches: [ master, main ]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run tauri:build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Mac Intel Build
  build-mac-intel:
    runs-on: macos-13  # Intel Mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Mac Intel app
        run: npm run tauri:build:mac:x64

      - name: Upload Mac Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-mac-intel
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

  # Mac ARM Build (M1/M2/M3)
  build-mac-arm:
    runs-on: macos-14  # ARM Mac (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Mac ARM app
        run: npm run tauri:build:mac:arm64

      - name: Upload Mac ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-mac-arm
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
