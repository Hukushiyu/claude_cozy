name: Build Claude Cozy

on:
  # Trigger on push to master branch
  push:
    branches: [ master, main ]

  # Trigger on pull requests
  pull_request:
    branches: [ master, main ]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

env:
  # Opt into Node.js 24 for GitHub Actions (becomes default June 2nd, 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:win

      - name: Sign Windows bundles
        run: |
          # Get version from package.json
          $VERSION = (Get-Content package.json | ConvertFrom-Json).version

          # Write signing key to temporary file (avoids env var auto-detection)
          $KEY_FILE = "$env:RUNNER_TEMP\signing.key"
          "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | Out-File -FilePath $KEY_FILE -NoNewline -Encoding utf8

          # Sign NSIS installer
          npx tauri signer sign "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Claude Cozy_${VERSION}_x64-setup.exe" --private-key-path "$KEY_FILE" --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"

          # Sign MSI installer
          npx tauri signer sign "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/Claude Cozy_${VERSION}_x64_en-US.msi" --private-key-path "$KEY_FILE" --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"

          # Clean up key file
          Remove-Item $KEY_FILE

          # Verify signatures were created
          Write-Output "=== Signature files created ==="
          Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -Filter "*.sig"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-cozy-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig

  # Mac ARM Build (M1/M2/M3) with Code Signing
  build-mac-arm:
    runs-on: macos-14  # ARM Mac (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Import code signing certificate
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate from base64 and save to file
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH

          # Allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Verify certificate is available
          echo "Available signing identities:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build Mac ARM app (signed)
        if: github.event_name != 'pull_request'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:mac:arm64

      - name: Build Mac ARM app (unsigned - PR only)
        if: github.event_name == 'pull_request'
        run: npm run tauri:build:mac:arm64

      - name: Notarize Mac ARM app
        if: github.event_name != 'pull_request'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "Notarizing .app bundle..."
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Claude Cozy.app"

          # Save API key to temporary file (notarytool expects a file path)
          API_KEY_FILE="${RUNNER_TEMP}/AuthKey.p8"
          echo "$APPLE_API_KEY" > "$API_KEY_FILE"

          # Create a temporary zip for notarization (Apple requires zip format)
          NOTARIZE_ZIP="${RUNNER_TEMP}/notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"

          # Submit for notarization
          echo "Submitting to Apple notarization service..."
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$API_KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          # Clean up API key file
          rm "$API_KEY_FILE"

          # Staple the notarization ticket to the app
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"

          # Verify stapling
          echo "Verifying notarization..."
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv -t install "$APP_PATH"

          echo "✅ App notarized and stapled successfully"

      - name: Create ZIP from .app bundle
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos

          # Get version from package.json
          VERSION=$(node -p "require('../../../../../../package.json').version")

          # Create ZIP with dynamic version
          zip -ry "../Claude.Cozy_${VERSION}_aarch64.app.tar.gz" "Claude Cozy.app"

          # Note: DMG creation happens automatically by Tauri if configured in tauri.conf.json

          echo "=== Build outputs ==="
          ls -la ../

      - name: Sign Mac bundles
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")

          # Write signing key to temporary file (avoids env var auto-detection)
          KEY_FILE="${RUNNER_TEMP}/signing.key"
          echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > "$KEY_FILE"

          # Sign DMG
          if [ -f "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Claude Cozy_${VERSION}_aarch64.dmg" ]; then
            npx tauri signer sign "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Claude Cozy_${VERSION}_aarch64.dmg" \
              --private-key-path "$KEY_FILE" \
              --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          fi

          # Sign app.tar.gz
          if [ -f "src-tauri/target/aarch64-apple-darwin/release/bundle/Claude Cozy_${VERSION}_aarch64.app.tar.gz" ]; then
            npx tauri signer sign "src-tauri/target/aarch64-apple-darwin/release/bundle/Claude Cozy_${VERSION}_aarch64.app.tar.gz" \
              --private-key-path "$KEY_FILE" \
              --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          fi

          # Clean up key file
          rm "$KEY_FILE"

          # Verify signatures were created
          echo "=== Signature files created ==="
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.sig"

      - name: Clean up keychain
        if: always() && github.event_name != 'pull_request'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

      - name: Upload Mac ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-cozy-mac-arm
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/*.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/*.tar.gz.sig

  # Generate update manifest (latest.json) for Tauri updater
  generate-updater-manifest:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac-arm]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: claude-cozy-windows
          path: ./artifacts/windows

      - name: Download Mac ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: claude-cozy-mac-arm
          path: ./artifacts/mac-arm

      - name: Generate latest.json with signatures
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%d")

          echo "=== Checking for signature files ==="
          echo "Windows artifacts:"
          ls -la ./artifacts/windows/ || echo "No Windows artifacts found"
          echo ""
          echo "Mac ARM artifacts:"
          ls -la ./artifacts/mac-arm/ || echo "No Mac ARM artifacts found"
          echo ""

          # Extract signatures from .sig files generated during build
          WINDOWS_SIG_FILE=$(find ./artifacts/windows -name "*.nsis.zip.sig" -o -name "*-setup.exe.sig" | head -1)
          MAC_ARM_SIG_FILE=$(find ./artifacts/mac-arm -name "*.app.tar.gz.sig" | head -1)

          echo "Windows sig file: $WINDOWS_SIG_FILE"
          echo "Mac ARM sig file: $MAC_ARM_SIG_FILE"

          if [ -f "$WINDOWS_SIG_FILE" ]; then
            WINDOWS_SIG=$(cat "$WINDOWS_SIG_FILE")
            echo "Windows signature loaded: ${WINDOWS_SIG:0:50}..."
          else
            echo "ERROR: Windows signature not found!"
            WINDOWS_SIG=""
          fi

          if [ -f "$MAC_ARM_SIG_FILE" ]; then
            MAC_ARM_SIG=$(cat "$MAC_ARM_SIG_FILE")
            echo "Mac ARM signature loaded: ${MAC_ARM_SIG:0:50}..."
          else
            echo "ERROR: Mac ARM signature not found!"
            MAC_ARM_SIG=""
          fi

          cat > latest.json << EOF
          {
            "version": "v${VERSION}",
            "date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/Hukushiyu/claude_cozy/releases/download/v${VERSION}/Claude.Cozy_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "https://github.com/Hukushiyu/claude_cozy/releases/download/v${VERSION}/Claude.Cozy_${VERSION}_aarch64.app.tar.gz"
              }
            }
          }
          EOF

          echo ""
          echo "=== Generated latest.json ==="
          cat latest.json

      - name: Upload latest.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: latest.json
