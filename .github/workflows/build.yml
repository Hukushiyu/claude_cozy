name: Build Claude Terminal

on:
  # Trigger on push to master branch
  push:
    branches: [ master, main ]

  # Trigger on pull requests
  pull_request:
    branches: [ master, main ]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

env:
  # Opt into Node.js 24 for GitHub Actions (becomes default June 2nd, 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run tauri:build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  # Mac ARM Build (M1/M2/M3)
  # Intel Mac build commented out - ARM users can use this, Intel users will use Rosetta 2
  build-mac-arm:
    runs-on: macos-14  # ARM Mac (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Mac ARM app
        run: npm run tauri:build:mac:arm64

      - name: Create zip from .app bundle
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r "Claude Terminal_0.6.2_aarch64.zip" "Claude Terminal.app"
          mv "Claude Terminal_0.6.2_aarch64.zip" ../../

      - name: Upload Mac ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-mac-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/Claude Terminal_0.6.2_aarch64.zip
