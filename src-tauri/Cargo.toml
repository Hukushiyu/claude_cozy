[package]
name = "claude-cozy"
version = "0.8.0"
description = "Desktop GUI wrapper for Claude CLI"
authors = ["Claude Cozy"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
ignore = "0.4"
lazy_static = "1.4"
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
